# Martin: Ebenen des Routing-Matchers (routing/README.md), Schema routing_martin (routing/martin.sql, von routing_qa.sh).
# Erzeugt von routing/martin_konfig.py aus den Spalten der Tabellen. Eigene Konfiguration neben rvn_matching.yaml: Martin
# startet nur, wenn alle Tabellen existieren, also erst routing_qa.sh laufen lassen. Start (Verbindung aus DATABASE_URL):
#   docker run -d --name routing-qa-martin --network host -e DATABASE_URL=postgresql://USER:PASS@localhost:5433/postgres \
#     -v "$PWD/graph-interface/bikegraph/martin:/cfg:ro" ghcr.io/maplibre/martin:latest --config /cfg/routing_qa.yaml
# Vorschau: http://localhost:3001/ · Kacheln: http://localhost:3001/{routing_radwege,routing_wege,routing_strassen,routing_rvn_diff,routing_routen,routing_crossings,routing_unbequem,routing_luecken,routing_rvn,routing_diff_v7,routing_urteil_routing,routing_urteil_v7,routing_urteil_grenzfall,routing_haltestellen}/{z}/{x}/{y}
listen_addresses: '0.0.0.0:3001'
# Kein Kachel-Cache: routing_qa.sh baut die Tabellen neu
cache_size_mb: 0
web_ui: enable-for-all
postgres:
  connection_string: ${DATABASE_URL}
  auto_publish: false
  tables:
    routing_radwege:
      schema: routing_martin
      table: routing_radwege
      srid: 25833
      geometry_column: geom
      geometry_type: LINESTRING
      id_column: id
      minzoom: 12
      properties:
        highway: text
        herkunft: text
        routing_id: text
        fuehr0: text
        fuehr1: text
        faktor0: numeric
        faktor1: numeric
        richtung: text
        len: numeric
    routing_wege:
      schema: routing_martin
      table: routing_wege
      srid: 25833
      geometry_column: geom
      geometry_type: LINESTRING
      id_column: id
      minzoom: 13
      properties:
        highway: text
        herkunft: text
        routing_id: text
        fuehr0: text
        fuehr1: text
        faktor0: numeric
        faktor1: numeric
        richtung: text
        zusatz: text
        faktor_plus: numeric
        len: numeric
    routing_strassen:
      schema: routing_martin
      table: routing_strassen
      srid: 25833
      geometry_column: geom
      geometry_type: LINESTRING
      id_column: id
      minzoom: 13
      properties:
        highway: text
        herkunft: text
        routing_id: text
        fuehr0: text
        fuehr1: text
        faktor0: numeric
        faktor1: numeric
        richtung: text
        zusatz: text
        faktor_plus: numeric
        len: numeric
    routing_rvn_diff:
      schema: routing_martin
      table: routing_rvn_diff
      srid: 25833
      geometry_column: geom
      geometry_type: MULTILINESTRING
      id_column: id
      properties:
        element_nr: text
        art: text
        beschreibung: text
        element_darunter: text
        strassenname: text
        laenge_m: numeric
    routing_routen:
      schema: routing_martin
      table: routing_routen
      srid: 25833
      geometry_column: geom
      geometry_type: LINESTRING
      id_column: id
      minzoom: 12
      properties:
        kante: int8
        ri: int4
        routing_id: text
        objekt: text
        fuehr: text
        faktor: numeric
        routen: int4
        rids: text
    routing_crossings:
