        m: numeric
        fuehr: text
        fuehr_alle: text
        von_gabelung: bool
        bis_gabelung: bool
        zusatz: text
        zusatz_m: numeric
        unbequem: bool
        lang: bool
        mittel_m: numeric
        faktor: numeric
        rang: int4
    routing_unbequem:
      schema: routing_martin
      table: routing_unbequem
      srid: 25833
      geometry_column: geom
      geometry_type: LINESTRING
